<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yönetici Paneli</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:#f3f4f6; color:#111; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:14px; }
  input { padding:10px; font-size:15px; border:1px solid #d1d5db; border-radius:8px; }
  button { padding:10px 14px; font-size:15px; border:0; border-radius:8px; cursor:pointer; background:#1d4ed8; color:#fff; }
  .ghost { background:#e5e7eb; color:#374151; }
  .hidden { display:none !important; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .msg { padding:10px; border-radius:8px; font-size:14px; margin-top:10px; word-break:break-word; }
  .err { background:#fee2e2; color:#991b1b; }
  .err a { color:#991b1b; font-weight:600; }

  /* Özet */
  .sum { display:flex; gap:16px; flex-wrap:wrap; font-size:15px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }

  /* Personel kartları */
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
  .pcard { border-radius:12px; padding:12px; cursor:pointer; color:#fff; transition:transform .08s; }
  .pcard:active { transform:scale(.97); }
  .pcard.in   { background:#16a34a; }
  .pcard.out  { background:#dc2626; }
  .pcard.none { background:#9ca3af; }
  .pcard .st { font-size:11px; font-weight:700; letter-spacing:.6px; opacity:.9; }
  .pcard .nm { font-size:17px; font-weight:700; margin:2px 0 6px; }
  .pcard .ln { font-size:13px; opacity:.95; margin-top:2px; }
  .pcard .ln b { font-weight:600; }

  /* Detay penceresi */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow:auto; z-index:10; }
  .box { background:#fff; border-radius:14px; max-width:640px; width:100%; padding:16px; }
  .box h2 { margin:0; font-size:19px; }
  .month { margin-top:16px; padding-bottom:4px; border-bottom:2px solid #e5e7eb; display:flex; justify-content:space-between; font-weight:700; font-size:15px; }
  .month span { color:#1d4ed8; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 5px; border-bottom:1px solid #f3f4f6; white-space:nowrap; }
  th { font-size:11px; text-transform:uppercase; color:#6b7280; }
  .g { color:#16a34a; font-weight:600; } .c { color:#dc2626; font-weight:600; }
  .muted { color:#9ca3af; }
  .note { color:#6b7280; font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Yönetici Paneli</h1>

  <!-- Oturum açma -->
  <div id="loginCard" class="card">
    <div class="row">
      <input id="email" type="text" placeholder="Kullanıcı adı" autocomplete="username" autocapitalize="none">
      <input id="pass" type="password" placeholder="Şifre" autocomplete="current-password">
      <button id="loginBtn">Oturum Aç</button>
    </div>
    <div id="loginMsg"></div>
  </div>

  <div id="panel" class="hidden">
    <!-- Özet -->
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="sum">
          <div><span class="dot" style="background:#16a34a"></span>İçeride: <b id="nIn">0</b></div>
          <div><span class="dot" style="background:#dc2626"></span>Dışarıda: <b id="nOut">0</b></div>
          <div>Toplam: <b id="nAll">0</b></div>
        </div>
        <button class="ghost" id="logoutBtn">Oturumu kapat</button>
      </div>
      <div id="panelMsg"></div>
    </div>

    <!-- Personel kartları -->
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px">Personel <span class="note">— geçmişi görmek için karta dokunun</span></div>
      <div class="cards" id="cards"></div>
    </div>

    <!-- Rapor -->
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px">Tüm personel için Excel raporu</div>
      <div class="row">
        <input type="date" id="from"> — <input type="date" id="to">
        <button id="reportBtn">Excel indir</button>
      </div>
      <div class="note">Kayıtlar sunucu saatiyle damgalanır; hiçbir kayıt değiştirilemez veya silinemez.</div>
      <div id="reportMsg"></div>
    </div>
  </div>
</div>

<!-- Personel geçmişi penceresi -->
<div id="modal" class="modal hidden">
  <div class="box">
    <div class="row" style="justify-content:space-between">
      <h2 id="mName"></h2>
      <div class="row">
        <button class="ghost" id="mCsv">Excel</button>
        <button class="ghost" id="mClose">Kapat ✕</button>
      </div>
    </div>
    <div id="mBody" style="margin-top:8px"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, query, where, orderBy, onSnapshot, getDocs, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig, OTEL_ADI } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
$("title").textContent = OTEL_ADI + " — Yönetici Paneli";

// ---- Yardımcılar ----
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmtD  = d => d.toLocaleDateString("tr-TR");
const fmtHM = d => d.toLocaleTimeString("tr-TR", { hour:"2-digit", minute:"2-digit" });
const fmtDT = ts => ts ? `${fmtD(ts.toDate())} ${fmtHM(ts.toDate())}` : "—";
const fmtDur = ms => { const m = Math.round(ms / 60000); return `${Math.floor(m/60)} sa ${m%60} dk`; };
const ayniGun = (a, b) => a && b && a.toDateString() === b.toDateString();
const bugunStr = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`; };

function hataHtml(e) {
  const t = esc(e && e.message ? e.message : e).replace(/(https:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
  return `<div class="msg err">${t}<br><small>Mesajda bir link varsa tıklayın, açılan sayfada "Create index / Dizin oluştur" deyin, 2–3 dk sonra tekrar deneyin.</small></div>`;
}

// Kayıtları giriş→çıkış çiftlerine (vardiyalara) dönüştürür. rows: tek personel, eskiden yeniye.
function vardiyalar(rows) {
  const out = []; let acik = null;
  for (const r of rows) {
    if (!r.ts) continue;
    const t = r.ts.toDate();
    if (r.type === "in") { if (acik) out.push(acik); acik = { gir: t, cik: null }; }
    else { if (acik) { acik.cik = t; out.push(acik); acik = null; } else out.push({ gir: null, cik: t }); }
  }
  if (acik) out.push(acik);
  return out;
}
const sure = v => v.gir && v.cik ? v.cik - v.gir : 0;

function csvIndir(dosya, satirlar) {
  const blob = new Blob(["\ufeff" + satirlar.map(r => r.join(";")).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = dosya; a.click();
}

// ---- Oturum ----
let users = {}, durum = {}, unsubs = [];

$("loginBtn").onclick = async () => {
  $("loginMsg").innerHTML = "";
  let u = $("email").value.trim().toLowerCase(); if (!u.includes("@")) u += "@rotahotel.local";
  try { await signInWithEmailAndPassword(auth, u, $("pass").value); }
  catch { $("loginMsg").innerHTML = '<div class="msg err">Kullanıcı adı veya şifre hatalı.</div>'; }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  unsubs.forEach(f => f()); unsubs = [];
  if (!user) { $("loginCard").classList.remove("hidden"); $("panel").classList.add("hidden"); return; }

  let admin = null;
  try { admin = await getDoc(doc(db, "admins", user.uid)); } catch {}
  if (!admin || !admin.exists()) {
    $("loginMsg").innerHTML = '<div class="msg err">Bu hesap yönetici değil. (Firestore > admins koleksiyonuna UID eklenmeli)</div>';
    await signOut(auth); return;
  }

  $("loginCard").classList.add("hidden"); $("panel").classList.remove("hidden");
  $("from").value = bugunStr(); $("to").value = bugunStr();

  unsubs.push(onSnapshot(collection(db, "users"), s => {
    users = {}; s.forEach(d => users[d.id] = d.data()); ciz();
  }, e => $("panelMsg").innerHTML = hataHtml(e)));

  unsubs.push(onSnapshot(collection(db, "durum"), s => {
    durum = {}; s.forEach(d => durum[d.id] = d.data()); ciz();
  }, e => $("panelMsg").innerHTML = hataHtml(e)));
});

// ---- Kartlar ----
function ciz() {
  const ids = Object.keys(users).sort((a, b) => {
    const ia = durum[a]?.type === "in", ib = durum[b]?.type === "in";
    if (ia !== ib) return ia ? -1 : 1;
    return (users[a].name || "").localeCompare(users[b].name || "", "tr");
  });
  let nIn = 0;
  $("cards").innerHTML = ids.map(uid => {
    const d = durum[uid];
    const cls = !d ? "none" : d.type === "in" ? "in" : "out";
    if (cls === "in") nIn++;
    const etiket = cls === "in" ? "İÇERİDE" : cls === "out" ? "DIŞARIDA" : "HENÜZ KAYIT YOK";
    const icerdeSure = cls === "in" && d.lastIn ? `<div class="ln">⏱ ${fmtDur(Date.now() - d.lastIn.toMillis())}dir içeride</div>` : "";
    return `<div class="pcard ${cls}" data-uid="${uid}">
      <div class="st">${etiket}</div>
      <div class="nm">${esc(users[uid].name)}</div>
      <div class="ln">Son giriş: <b>${fmtDT(d?.lastIn)}</b></div>
      <div class="ln">Son çıkış: <b>${fmtDT(d?.lastOut)}</b></div>
      ${icerdeSure}
    </div>`;
  }).join("") || '<div class="muted">Henüz personel yok. Personel ilk kez oturum açıp adını yazınca burada görünür.</div>';
  $("nIn").textContent = nIn;
  $("nOut").textContent = ids.length - nIn;
  $("nAll").textContent = ids.length;
}
setInterval(ciz, 60000); // "içeride" süresini dakikada bir güncelle

$("cards").onclick = e => {
  const c = e.target.closest(".pcard");
  if (c) gecmisAc(c.dataset.uid);
};

// ---- Personel geçmişi ----
let acikKisi = null;

async function gecmisAc(uid) {
  const ad = users[uid]?.name || "";
  acikKisi = { ad, liste: [] };
  $("mName").textContent = ad;
  $("mBody").innerHTML = '<div class="muted">Yükleniyor…</div>';
  $("modal").classList.remove("hidden");
  try {
    const s = await getDocs(query(collection(db, "logs"), where("uid", "==", uid), orderBy("ts", "desc")));
    const rows = []; s.forEach(d => rows.push(d.data()));
    rows.reverse();
    const liste = vardiyalar(rows).reverse(); // yeniden eskiye
    acikKisi.liste = liste;
    if (!liste.length) { $("mBody").innerHTML = '<div class="muted">Bu personelin henüz kaydı yok.</div>'; return; }

    // Aylara göre grupla
    const aylar = [];
    for (const v of liste) {
      const ref = v.gir || v.cik;
      const key = ref.getFullYear() + "-" + ref.getMonth();
      let ay = aylar.find(a => a.key === key);
      if (!ay) { ay = { key, ad: ref.toLocaleDateString("tr-TR", { month:"long", year:"numeric" }), v: [], top: 0, gun: new Set() }; aylar.push(ay); }
      ay.v.push(v); ay.top += sure(v); ay.gun.add(ref.toDateString());
    }
    $("mBody").innerHTML = aylar.map(ay => `
      <div class="month">${esc(ay.ad)} <span>${ay.gun.size} gün · ${fmtDur(ay.top)}</span></div>
      <table>
        <thead><tr><th>Tarih</th><th>Giriş</th><th>Çıkış</th><th>Süre</th></tr></thead>
        <tbody>${ay.v.map(v => {
          const ref = v.gir || v.cik;
          const cik = !v.cik ? '<span class="muted">içeride</span>'
                    : (v.gir && !ayniGun(v.gir, v.cik) ? `${fmtD(v.cik).slice(0,5)} ${fmtHM(v.cik)}` : fmtHM(v.cik));
          return `<tr>
            <td>${fmtD(ref)}</td>
            <td class="g">${v.gir ? fmtHM(v.gir) : '<span class="muted">—</span>'}</td>
            <td class="c">${cik}</td>
            <td>${sure(v) ? fmtDur(sure(v)) : '<span class="muted">—</span>'}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`).join("");
  } catch (e) {
    $("mBody").innerHTML = hataHtml(e);
  }
}

const kapat = () => $("modal").classList.add("hidden");
$("mClose").onclick = kapat;
$("modal").onclick = e => { if (e.target.id === "modal") kapat(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") kapat(); });

$("mCsv").onclick = () => {
  if (!acikKisi || !acikKisi.liste.length) return;
  const satir = [["Personel", "Tarih", "Giriş", "Çıkış", "Süre (dk)"]];
  [...acikKisi.liste].reverse().forEach(v => {
    const ref = v.gir || v.cik;
    satir.push([acikKisi.ad, fmtD(ref), v.gir ? fmtHM(v.gir) : "", v.cik ? `${fmtD(v.cik)} ${fmtHM(v.cik)}` : "", sure(v) ? Math.round(sure(v) / 60000) : ""]);
  });
  csvIndir(`${acikKisi.ad.replace(/\s+/g, "_")}_gecmis.csv`, satir);
};

// ---- Tüm personel raporu ----
$("reportBtn").onclick = async () => {
  $("reportMsg").innerHTML = "";
  try {
    const from = new Date($("from").value + "T00:00:00");
    const to = new Date($("to").value + "T23:59:59.999");
    const s = await getDocs(query(collection(db, "logs"),
      where("ts", ">=", Timestamp.fromDate(from)), where("ts", "<=", Timestamp.fromDate(to)), orderBy("ts", "asc")));
    const kisi = {};
    s.forEach(d => { const r = d.data(); (kisi[r.uid] ||= []).push(r); });
    const satir = [["Personel", "Tarih", "Giriş", "Çıkış", "Süre (dk)"]];
    Object.keys(kisi)
      .sort((a, b) => (users[a]?.name || "").localeCompare(users[b]?.name || "", "tr"))
      .forEach(uid => {
        const ad = users[uid]?.name || kisi[uid][0].name;
        let top = 0;
        vardiyalar(kisi[uid]).forEach(v => {
          const ref = v.gir || v.cik; top += sure(v);
          satir.push([ad, fmtD(ref), v.gir ? fmtHM(v.gir) : "", v.cik ? `${fmtD(v.cik)} ${fmtHM(v.cik)}` : "", sure(v) ? Math.round(sure(v) / 60000) : ""]);
        });
        satir.push([ad + " TOPLAM", "", "", "", Math.round(top / 60000)]);
        satir.push([]);
      });
    if (satir.length === 1) { $("reportMsg").innerHTML = '<div class="note">Bu tarih aralığında kayıt yok.</div>'; return; }
    csvIndir(`puantaj_${$("from").value}_${$("to").value}.csv`, satir);
  } catch (e) {
    $("reportMsg").innerHTML = hataHtml(e);
  }
};
</script>
</body>
</html>
